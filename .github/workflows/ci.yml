# TeamFlow CI — audit P1. Runs on every PR; merge blocks on red.
# Gates: check-types, lint (backend is a zero-warning gate via its own
# `eslint . --max-warnings 0` script), unit tests, pnpm audit, Gitleaks.
# The multi-tenant integration suite runs separately with live Postgres+Redis.
name: ci

on:
  push:
    branches: [main, "v0/*"]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: types + lint + unit + audit + secrets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskChecker
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: check-types
        run: pnpm run check-types

      - name: lint
        # Both workspaces gate on zero warnings (each lint script passes
        # --max-warnings 0), so any new warning fails the build.
        run: pnpm run lint

      - name: unit tests (bun, no infra — DB suites self-skip)
        run: bun test
        working-directory: taskChecker/apps/backend

      - name: pnpm audit (high+)
        run: pnpm audit --audit-level high

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration:
    name: multi-tenant integration (Postgres + Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskChecker/apps/backend
    services:
      # Mirrors docker-compose: `postgres` is the bootstrap superuser
      # (migrations + SECURITY DEFINER owners); the app connects as the
      # NOSUPERUSER `teamflow` role so RLS actually applies in the suite.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teamflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://teamflow:teamflow@localhost:5432/teamflow
      DATABASE_MIGRATE_URL: postgres://postgres:postgres@localhost:5432/teamflow
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-test-secret-with-enough-entropy-0123456789
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: pnpm install --frozen-lockfile=false
        working-directory: taskChecker

      - name: Create restricted app role (RLS applies only to non-superusers)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d teamflow -c "CREATE ROLE teamflow LOGIN PASSWORD 'teamflow' NOSUPERUSER NOCREATEDB NOCREATEROLE; GRANT ALL ON SCHEMA public TO teamflow; GRANT ALL ON DATABASE teamflow TO teamflow;"

      - name: Migrate (as bootstrap superuser)
        run: bun run db:migrate

      - name: integration suite
        run: TEAMFLOW_IT=1 bun test test/integration.test.ts
